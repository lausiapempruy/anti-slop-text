<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="bt bd">
  <title id="bt">anti-slop-text</title>
  <desc id="bd">A sentence full of stock phrases (robust, seamlessly, leverages, cutting-edge, unlock) gets highlighted and struck through, then a plain sentence about what the tool does replaces it.</desc>
  <style>
.bg{fill:#f1ece0}
.card{fill:#fbf8f1;stroke:#d6ceba;stroke-width:1.5}
.serif{font-family:Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.ink{fill:#1d1a16}
.muted{fill:#6a6356}
.lbl{font-size:14px;font-weight:700;letter-spacing:2.2px;fill:#6a6356}
.body{font-size:28px;fill:#1d1a16}
.hl{fill:#f6dc7a;transform-box:fill-box;transform-origin:left center}
.st{stroke:#b8321d;stroke-width:3.5;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:0}
.ok{stroke:#3f9a52;stroke-width:4;stroke-linecap:round;fill:none;stroke-dasharray:1;stroke-dashoffset:0}

@keyframes h0{0%,10.0%{transform:scaleX(0)}16.0%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes s0{0%,28.0%{stroke-dashoffset:1}33.0%,92%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}
@keyframes h1{0%,12.5%{transform:scaleX(0)}18.5%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes s1{0%,31.0%{stroke-dashoffset:1}36.0%,92%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}
@keyframes h2{0%,15.0%{transform:scaleX(0)}21.0%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes s2{0%,34.0%{stroke-dashoffset:1}39.0%,92%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}
@keyframes h3{0%,17.5%{transform:scaleX(0)}23.5%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes s3{0%,37.0%{stroke-dashoffset:1}42.0%,92%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}
@keyframes h4{0%,20.0%{transform:scaleX(0)}26.0%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes s4{0%,40.0%{stroke-dashoffset:1}45.0%,92%{stroke-dashoffset:0}97%,100%{stroke-dashoffset:1}}
@keyframes dim{0%,46%{opacity:1}52%,92%{opacity:.45}97%,100%{opacity:1}}
@keyframes aft{0%,54%{opacity:0;transform:translateY(8px)}60%,92%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes okl{0%,60%{stroke-dashoffset:1}68%,92%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:1}}
@media (prefers-reduced-motion:no-preference){
.hl0{animation:h0 10s ease-in-out infinite}
.st0{animation:s0 10s ease-in-out infinite}
.hl1{animation:h1 10s ease-in-out infinite}
.st1{animation:s1 10s ease-in-out infinite}
.hl2{animation:h2 10s ease-in-out infinite}
.st2{animation:s2 10s ease-in-out infinite}
.hl3{animation:h3 10s ease-in-out infinite}
.st3{animation:s3 10s ease-in-out infinite}
.hl4{animation:h4 10s ease-in-out infinite}
.st4{animation:s4 10s ease-in-out infinite}
.before{animation:dim 10s ease-in-out infinite}
.after{animation:aft 10s ease-out infinite}
.okl{animation:okl 10s ease-in-out infinite}
}
  </style>
  <rect class="bg" width="1200" height="440" rx="20"/>
  <g transform="translate(48 40) scale(1.25)">
    <rect width="64" height="64" rx="14" fill="#1d1a16"/>
    <rect x="9" y="14" width="46" height="15" rx="3.5" fill="#f2c94c"/>
    <path d="M12 45h40M12 54h26" stroke="#faf7f0" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M5 21.5h54" stroke="#e0533a" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <text class="serif ink" x="148" y="88" font-size="46" font-weight="700" letter-spacing="-0.5">anti-slop-text</text>
  <text class="sans muted" x="148" y="122" font-size="19">Mark the phrases that say little. A Claude skill and a browser scanner, in Indonesian and English.</text>
  <rect class="card" x="48" y="150" width="1104" height="262" rx="14"/>
  <text class="sans lbl" x="80" y="190">BEFORE</text>
  <g class="before serif body">
    <rect class="hl hl0" x="133.6" y="209.0" width="94.4" height="31.4" rx="4"/>
    <rect class="hl hl1" x="364.0" y="209.0" width="152.0" height="31.4" rx="4"/>
    <rect class="hl hl2" x="522.4" y="209.0" width="137.6" height="31.4" rx="4"/>
    <rect class="hl hl3" x="76.0" y="249.0" width="180.8" height="31.4" rx="4"/>
    <rect class="hl hl4" x="464.8" y="249.0" width="94.4" height="31.4" rx="4"/>
    <text x="80.0" y="232" textLength="43.2" lengthAdjust="spacingAndGlyphs">Our</text>
    <text x="137.6" y="232" textLength="86.4" lengthAdjust="spacingAndGlyphs">robust</text>
    <text x="238.4" y="232" textLength="115.2" lengthAdjust="spacingAndGlyphs">platform</text>
    <text x="368.0" y="232" textLength="144.0" lengthAdjust="spacingAndGlyphs">seamlessly</text>
    <text x="526.4" y="232" textLength="129.6" lengthAdjust="spacingAndGlyphs">leverages</text>
    <text x="80.0" y="272" textLength="172.8" lengthAdjust="spacingAndGlyphs">cutting-edge</text>
    <text x="267.2" y="272" textLength="187.2" lengthAdjust="spacingAndGlyphs">technology to</text>
    <text x="468.8" y="272" textLength="86.4" lengthAdjust="spacingAndGlyphs">unlock</text>
    <text x="569.6" y="272" textLength="316.8" lengthAdjust="spacingAndGlyphs">your team's potential.</text>
    <line class="st st0" pathLength="1" x1="134.6" y1="223.6" x2="227.0" y2="223.6"/>
    <line class="st st1" pathLength="1" x1="365.0" y1="223.6" x2="515.0" y2="223.6"/>
    <line class="st st2" pathLength="1" x1="523.4" y1="223.6" x2="659.0" y2="223.6"/>
    <line class="st st3" pathLength="1" x1="77.0" y1="263.6" x2="255.8" y2="263.6"/>
    <line class="st st4" pathLength="1" x1="465.8" y1="263.6" x2="558.2" y2="263.6"/>
  </g>
  <text class="sans lbl" x="80" y="326">AFTER</text>
  <g class="after serif body">
    <text x="80" y="366" textLength="936.0" lengthAdjust="spacingAndGlyphs">Paste text. It marks stock phrases and shows where to read twice.</text>
    <line class="ok okl" pathLength="1" x1="80" y1="380" x2="1016.0" y2="380"/>
  </g>
</svg>
